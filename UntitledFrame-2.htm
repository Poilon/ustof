<style>
  /* Remplacement du Flash c131.swf - bannière animée */
  .flash-banner {
    width: 1024px;
    height: 192px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .flash-banner h1 {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 72px;
    color: #FF0000;
    text-shadow: 0 0 20px #FF0000, 0 0 40px #990000, 0 0 60px #660000;
    letter-spacing: 15px;
    animation: glow 2s ease-in-out infinite alternate;
    margin: 0;
  }
  @keyframes glow {
    from { text-shadow: 0 0 20px #FF0000, 0 0 40px #990000; opacity: 0.8; }
    to { text-shadow: 0 0 30px #FF0000, 0 0 60px #990000, 0 0 80px #660000; opacity: 1; }
  }
  .flash-banner .subtitle {
    font-family: 'Courier New', monospace;
    font-size: 18px;
    color: #FF0000;
    position: absolute;
    bottom: 20px;
    animation: slide 8s linear infinite;
  }
  @keyframes slide {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }
</style>
</head>

<body bgcolor="#000000" text="#FF0000" link="#FF0000" vlink="#FF0000" alink="#FF0000">
<p>
  <!-- Remplacement du Flash c131.swf par une bannière HTML/CSS -->

  </div>
